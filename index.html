<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141413">
<title>Suhbat</title>
<style>
  :root{
    --bg:#141413; --side:#111110; --card:#222220; --line:#3A3A37;
    --ink:#ECEAE3; --muted:#9C9A92; --coral:#DA7756; --blue:#78A9F5;
    --row:#343432; --user:#2A2A28;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;overflow:hidden}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  input,textarea{font:inherit;color:inherit}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  textarea:focus,textarea:focus-visible,input:focus,input:focus-visible{outline:none!important;box-shadow:none;-webkit-appearance:none;appearance:none}
  i[data-i]{display:inline-flex}

  #bg{position:fixed;inset:0;z-index:0;transition:opacity .8s}
  body.chatting #bg{opacity:.3}
  .app{position:relative;z-index:1;display:flex;height:100dvh}

  /* ---------- Sidebar ---------- */
  .side{position:fixed;inset:0;z-index:20;background:var(--side);display:flex;flex-direction:column;padding:16px 12px 0;transform:translateX(-100%);transition:transform .25s ease}
  .side.open{transform:none}
  .side-head{display:flex;align-items:center;gap:18px;padding:4px 8px}
  .side-head .x{width:40px;height:40px;display:grid;place-items:center;color:var(--ink)}
  .logo{font-family:var(--serif);font-size:32px;letter-spacing:-.01em}
  .search{display:flex;align-items:center;gap:12px;background:#242423;border-radius:18px;padding:13px 16px;margin:16px 0 14px;color:var(--muted)}
  .search input{flex:1;background:none;border:none;font-size:18px;color:var(--ink);min-width:0}
  .search input::placeholder{color:var(--muted)}
  .nav{display:flex;align-items:center;gap:18px;padding:13px 12px;border-radius:14px;width:100%;text-align:left;font-size:18px}
  .nav .ico{color:var(--muted);display:inline-flex}
  .nav.on{background:var(--row)}
  .nav.on .ico{color:var(--ink)}
  .up{margin-left:auto;border:1px solid #2B3F66;color:var(--blue);border-radius:999px;padding:3px 14px;font-size:16px}
  .try{margin-left:auto;background:#12305C;color:#8DB8FF;border-radius:10px;padding:2px 14px;font-size:16px}
  .sec{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:17px;padding:22px 4px 6px 12px}
  .sec .sb{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;color:var(--muted)}
  .sec .sb:hover{background:#1E1E1D;color:var(--ink)}
  .sec .sb svg{width:20px;height:20px}
  .chatlist{flex:1;overflow-y:auto;min-height:0;padding-bottom:8px}
  .ci{display:flex;align-items:center;gap:14px;padding:12px;border-radius:14px;cursor:pointer;font-size:18px}
  .ci:hover{background:#1E1E1D}
  .ci.on{background:var(--row)}
  .ci .dot{width:9px;height:9px;border:1.6px solid var(--muted);border-radius:50%;margin:0 5px;flex-shrink:0}
  .ci .star{color:var(--coral);width:19px;text-align:center;flex-shrink:0;font-size:15px}
  .ci .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ci .cnt{color:var(--muted);font-size:14px;flex-shrink:0}
  .ci .dots{color:var(--muted);padding:4px 6px;border-radius:8px;display:inline-flex;flex-shrink:0}
  .ci .dots:hover{background:#2B2B29;color:var(--ink)}
  .me{display:flex;align-items:center;gap:14px;padding:14px 8px calc(14px + env(safe-area-inset-bottom));border-top:1px solid #252524;width:100%;text-align:left}
  .av{width:42px;height:42px;border-radius:50%;background:#2F2F2D;display:grid;place-items:center;font-size:16px;flex-shrink:0;overflow:hidden}
  .av img{width:100%;height:100%;object-fit:cover}
  .mn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mn small{color:var(--muted);font-size:16px}
  .me .chev{color:var(--muted);display:inline-flex}

  /* ---------- Main ---------- */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;height:100dvh}
  .top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;min-height:60px}
  .top .b{width:44px;height:44px;display:grid;place-items:center;color:var(--ink);border-radius:12px}
  .top .b.on{color:var(--coral)}
  .plan{background:rgba(30,30,29,.85);color:var(--muted);border-radius:16px;padding:12px 26px;font-size:19px;white-space:nowrap;backdrop-filter:blur(6px)}
  .plan button{color:var(--blue);text-decoration:underline;text-underline-offset:4px;margin-left:8px}
  body.chatting .plan{visibility:hidden}

  .stage{flex:1;overflow-y:auto;display:flex;flex-direction:column;min-height:0}
  .empty{margin:auto;display:flex;flex-direction:column;align-items:center;gap:12px;padding:0 16px}
  .hello{display:flex;align-items:center;justify-content:center;gap:14px;font-family:var(--serif);font-size:clamp(26px,7.6vw,54px);letter-spacing:-.02em;white-space:nowrap}
  .hello .burst{color:var(--coral);display:inline-flex;animation:spin 30s linear infinite}
  .hello .burst svg{width:1.05em;height:1.05em}
  .tnote{color:var(--muted);font-size:15px}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes pulse{50%{opacity:.35}}

  .col{width:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:24px;padding:10px 18px 16px}
  .u{align-self:flex-end;background:var(--user);padding:12px 18px;border-radius:22px 22px 6px 22px;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere}
  .uf{font-size:13px;color:var(--muted);margin-bottom:4px;white-space:normal}
  .a{font-family:var(--serif);font-size:18.5px;line-height:1.62;overflow-wrap:anywhere}
  .a p{margin-bottom:12px}
  .a p:last-of-type{margin-bottom:0}
  .a h3,.a h4,.a h5{margin:16px 0 6px;font-weight:600}
  .a ul,.a ol{margin:0 0 12px 24px}
  .a code{background:#2A2A28;padding:1px 6px;border-radius:6px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.86em}
  .a pre{background:#0D0D0C;border:1px solid #2B2B29;padding:14px;border-radius:12px;overflow-x:auto;margin:8px 0 14px;font-size:14px;line-height:1.55}
  .a pre code{background:none;padding:0}
  .a.err{color:#F0857D;font-family:var(--sans);font-size:16px}
  .tools{margin-top:8px;font-family:var(--sans)}
  .cp{font-size:14px;color:var(--muted);padding:4px 10px;border-radius:8px}
  .cp:hover{background:#242423;color:var(--ink)}
  .think{color:var(--coral);display:inline-flex;animation:spin 2.4s linear infinite}
  .think svg{width:26px;height:26px}

  /* ---------- Pages ---------- */
  #page{display:none;flex:1;overflow-y:auto;min-height:0;padding:6px 18px 40px}
  .main.paged #page{display:block}
  .main.paged .stage,.main.paged .composer{display:none}
  .pg{max-width:760px;margin:0 auto}
  .pgh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 20px}
  .pg h2{font-family:var(--serif);font-weight:500;font-size:clamp(28px,7vw,40px);letter-spacing:-.02em}
  .muted{color:var(--muted)}
  .big{font-size:18px;line-height:1.6;margin-top:6px}
  .lbl{color:var(--muted);font-size:14px;margin:18px 0 8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .pc{text-align:left;background:rgba(30,30,29,.9);border:1px solid #2E2E2C;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px}
  .pc:hover{border-color:#4A4A46}
  .pc b{font-family:var(--serif);font-weight:500;font-size:20px}
  .pc span{color:var(--muted);font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pc small{color:var(--muted);font-size:13px}
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);margin:4px 0 8px;padding:6px 8px 6px 0}
  .rows .ci{background:rgba(30,30,29,.7);margin-bottom:8px;border:1px solid #2A2A28}
  .ac{background:rgba(30,30,29,.9);border:1px solid #2E2E2C;border-radius:18px;padding:14px;margin-bottom:12px}
  .ach{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
  .ach small{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ac pre{background:#0D0D0C;border-radius:12px;padding:12px;overflow:hidden;max-height:130px;font-size:13px;line-height:1.5;font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
  .acb{display:flex;gap:8px;margin-top:10px}
  .acb button{background:#2B2B29;border-radius:10px;padding:7px 14px;font-size:14px}
  .styles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .st{text-align:left;background:rgba(30,30,29,.9);border:1px solid #2E2E2C;border-radius:16px;padding:14px}
  .st.on{border-color:var(--coral)}
  .st b{display:block;font-weight:600}
  .st small{color:var(--muted);font-size:13.5px;line-height:1.35;display:block;margin-top:2px}
  .fld{display:block;margin-bottom:14px}
  .fld span{display:block;color:var(--muted);font-size:14px;margin-bottom:6px}
  .pg input,.pg textarea,.panel input,.panel textarea{width:100%;background:#242423;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px}
  .pg textarea,.panel textarea{min-height:120px;resize:vertical;line-height:1.45}
  .pg input:focus,.pg textarea:focus,.panel input:focus,.panel textarea:focus{border-color:#5A5A55}
  .btn{flex:1;background:var(--coral);color:#fff;border-radius:14px;padding:12px 16px;font-weight:600}
  .btn.ghost{background:#2B2B29;color:var(--ink)}
  .btn.sm{flex:none;padding:9px 16px;font-size:15px}
  .btn.full{width:100%;flex:none}
  .ccard{background:rgba(30,30,29,.9);border:1px solid #2E2E2C;border-radius:18px;padding:18px;line-height:1.6}

  /* ---------- Composer ---------- */
  .composer{padding:8px 14px calc(14px + env(safe-area-inset-bottom))}
  .card{max-width:760px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:10px 10px 8px 16px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
  .card:focus-within{border-color:#5A5A55}
  .files{display:flex;flex-wrap:wrap;gap:6px}
  .files:not(:empty){margin-bottom:8px}
  .fc{display:flex;align-items:center;gap:6px;background:#2B2B29;border-radius:10px;padding:4px 4px 4px 10px;font-size:13.5px;max-width:190px}
  .fc span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fc button{color:var(--muted);font-size:18px;line-height:1;padding:0 6px}
  textarea#input{display:block;width:100%;background:none;border:none;resize:none;font-size:17px;line-height:1.4;max-height:160px;padding:4px 0}
  textarea#input::placeholder{color:#8A8880}
  .row{display:flex;align-items:center;gap:6px;margin-top:6px;margin-left:-6px}
  .row svg{width:20px;height:20px}
  .ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
  .ic:active{background:#2C2C2A}
  .ic.on{color:var(--coral)}
  .mic.rec{color:var(--coral);animation:pulse 1s infinite}
  .seg{display:flex;background:#2B2B29;border-radius:13px;padding:3px;margin-left:2px}
  .seg button{width:46px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--muted)}
  .seg .on{background:#3C3C39;color:var(--ink);box-shadow:0 0 0 1px #4A4A47}
  .model{margin-left:auto;display:flex;align-items:center;gap:2px;font-size:15px;white-space:nowrap;padding:6px 8px;border-radius:10px}
  .model:active{background:#2C2C2A}
  .model svg{width:16px;height:16px;color:var(--muted)}
  .send{display:none;width:38px;height:38px;border-radius:50%;background:var(--coral);color:#fff;place-items:center;margin-left:4px}
  .send:disabled{opacity:.45;cursor:not-allowed}
  .card.typing .send{display:grid}
  .card.typing .mic,.card.typing .wave{display:none}

  /* ---------- Popover / Modal / Toast ---------- */
  .pop{position:fixed;z-index:85;background:#1F1F1E;border:1px solid var(--line);border-radius:18px;padding:6px;min-width:250px;max-width:min(340px,calc(100vw - 16px));box-shadow:0 12px 40px rgba(0,0,0,.55)}
  .pi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 12px;border-radius:12px;font-size:16px}
  .pi:hover,.pi:active{background:#2B2B29}
  .pi.danger{color:#F0857D}
  .pico{color:var(--muted);display:inline-flex}
  .pi.danger .pico{color:#F0857D}
  .pt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pt2{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
  .pt2 b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pt2 small{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pav .av{width:34px;height:34px;font-size:14px}
  .pchk{color:var(--coral);display:inline-flex}
  .sep{height:1px;background:#2E2E2C;margin:6px 4px}

  .sheet{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
  .sheet.show{display:flex}
  .panel{background:#1C1C1B;border:1px solid var(--line);border-radius:26px 26px 0 0;width:100%;max-width:520px;max-height:92dvh;overflow-y:auto;padding:24px 22px calc(26px + env(safe-area-inset-bottom))}
  .panel.wide{max-width:720px}
  .panel h3{font-family:var(--serif);font-weight:500;font-size:26px;margin-bottom:6px}
  .panel > p{color:var(--muted);font-size:15px;margin-bottom:16px}
  .mrow{display:flex;gap:10px;margin-top:18px}
  iframe.pv{width:100%;height:60dvh;border:1px solid var(--line);border-radius:12px;background:#fff}
  .toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%) translateY(8px);background:#2F2F2D;padding:10px 18px;border-radius:14px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:90;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%)}

  /* ---------- Desktop ---------- */
  @media (min-width:900px){
    .side{position:relative;width:310px;transform:none;flex-shrink:0;border-right:1px solid #232322;transition:margin .25s ease}
    .app.collapsed .side{margin-left:-310px}
    .side-head .x{display:none}
    .sheet{align-items:center}
    .panel{border-radius:26px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<div class="app" id="app">
  <aside class="side" id="side">
    <div class="side-head">
      <button class="x" id="closeSide" aria-label="Yopish"><i data-i="x"></i></button>
      <div class="logo">Suhbat</div>
    </div>
    <label class="search">
      <i data-i="search"></i>
      <input id="q" placeholder="Qidirish" autocomplete="off">
    </label>
    <button class="nav on" data-view="chat"><span class="ico"><i data-i="plus"></i></span>Yangi</button>
    <button class="nav" data-view="projects"><span class="ico"><i data-i="stack"></i></span>Loyihalar</button>
    <button class="nav" data-view="artifacts"><span class="ico"><i data-i="cube"></i></span>Artefaktlar</button>
    <button class="nav" data-view="code"><span class="ico"><i data-i="code"></i></span>Kod<span class="up">Yangilash</span></button>
    <button class="nav" data-view="customize"><span class="ico"><i data-i="brief"></i></span>Sozlash</button>
    <div class="sec">
      <span>Suhbatlar</span>
      <span>
        <button class="sb" id="allBtn" aria-label="Barcha suhbatlar"><i data-i="arrowout"></i></button>
        <button class="sb" id="sortBtn" aria-label="Saralash"><i data-i="sliders"></i></button>
      </span>
    </div>
    <div class="chatlist" id="list"></div>
    <button class="me" id="meBtn"></button>
  </aside>

  <section class="main" id="main">
    <div class="top">
      <button class="b" id="burger" aria-label="Menyu"><i data-i="panel"></i></button>
      <div class="plan">Bepul reja <span style="opacity:.6">·</span><button data-soon>Yangilash</button></div>
      <button class="b" id="ghost" aria-label="Vaqtincha suhbat"><i data-i="ghost"></i></button>
    </div>

    <div class="stage" id="stage"><div id="vw" style="display:flex;flex-direction:column;flex:1"></div></div>
    <div id="page"></div>

    <div class="composer">
      <div class="card" id="card">
        <div class="files" id="files"></div>
        <textarea id="input" rows="1" placeholder="Qanday yordam bera olaman?" aria-label="Xabar"></textarea>
        <div class="row">
          <button class="ic" id="plusBtn" aria-label="Qo'shish"><i data-i="plus"></i></button>
          <div class="seg">
            <button class="on" aria-label="Suhbat"><i data-i="chat"></i></button>
            <button data-soon aria-label="Vazifalar"><i data-i="list"></i></button>
          </div>
          <button class="model" id="modelBtn"><span id="modelName">2.5 Flash</span><i data-i="chev"></i></button>
          <button class="ic mic" id="micBtn" aria-label="Ovoz yozish"><i data-i="mic"></i></button>
          <button class="ic wave" data-soon aria-label="Ovozli rejim"><i data-i="wave"></i></button>
          <button class="send" id="send" aria-label="Yuborish"><i data-i="send"></i></button>
        </div>
      </div>
    </div>
  </section>
</div>

<input type="file" id="fileIn" multiple hidden accept="image/*,.pdf,.txt,.md,.csv,.json,.html,.css,.js,.ts,.py,.java,.c,.cpp,.xml,.yaml,.yml,.sql">
<div class="toast" id="toast"></div>

<script>
const SYSTEM = "Sen foydali yordamchisan. Foydalanuvchi qaysi tilda yozsa, o'sha tilda aniq va qisqa javob ber.";
const MODELS = [
  { id: "claude-opus-5.5", name: "Opus 5.5", sub: "CodeCraft API orqali" }
];
const CODECRAFT_API_URL = "https://codecraftapi.com/v1/chat/completions";
const CODECRAFT_API_KEY = "cc_ddTTa582NGQdGgHLw771PK32ZxRheEyqF3YJaOuVHjDhOpXp";
const STYLES = [
  { id: "normal", name: "Oddiy", sub: "Standart javoblar", add: "" },
  { id: "concise", name: "Qisqa", sub: "Kam so'z, aniq javob", add: " Juda qisqa va lo'nda javob ber." },
  { id: "explanatory", name: "Tushuntiruvchi", sub: "Batafsil, bosqichma-bosqich", add: " Batafsil va bosqichma-bosqich tushuntir." },
  { id: "formal", name: "Rasmiy", sub: "Ish uslubidagi til", add: " Rasmiy, ish yuritish uslubida yoz." }
];
const $ = id => document.getElementById(id);
const HOSTED = true;

/* ---------- Ikonkalar ---------- */
const I = {
  panel:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>',
  ghost:'<path d="M5 20V11a7 7 0 0 1 14 0v9l-3-2-2 2-2-2-2 2-2-2z"/><circle cx="9.5" cy="11" r=".6"/><circle cx="14.5" cy="11" r=".6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11"/><rect x="3.5" y="4.5" width="3" height="3" rx=".7"/><rect x="3.5" y="10.5" width="3" height="3" rx=".7"/><rect x="3.5" y="16.5" width="3" height="3" rx=".7"/>',
  mic:'<rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  wave:'<path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/>',
  send:'<path d="M12 19V5M5 12l7-7 7 7"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>',
  stack:'<path d="M5 8h14M7 5h10M4 11h16v9H4z"/>',
  cube:'<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/>',
  code:'<path d="M8 8l-5 4 5 4M16 8l5 4-5 4M14 5l-4 14"/>',

function ico(n, s){

function burst(){

/* ---------- Fon animatsiyasi: xatam naqshi + to'lqin ---------- */
(function(){
  const cv = $("bg"), ctx = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W = 0, H = 0, cell = 96;
  let origin = { x: innerWidth / 2, y: innerHeight * 0.45 };
  let tRip = performance.now();
  function resize(){
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cell = W < 600 ? 78 : 96;
    cv.width = W * dpr; cv.height = H * dpr;
    cv.style.width = W + "px"; cv.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if(reduce) draw(1);
  }
  function poly(cx, cy, r, rot, n){
    ctx.beginPath();
    for(let i = 0; i < n; i++){
      const a = rot + i * 2 * Math.PI / n;
      const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r;
      if(i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
    }
    ctx.closePath(); ctx.stroke();
  }
  function star(cx, cy, r, rot){ poly(cx, cy, r, rot, 4); poly(cx, cy, r, rot + Math.PI / 4, 4); }
  function draw(now){
    ctx.clearRect(0, 0, W, H);
    const age = (now - tRip) % 7000;
    const R = age * 0.22, amp = 1 - age / 7000;
    const cols = Math.ceil(W / cell) + 1, rows = Math.ceil(H / cell) + 1;
    ctx.lineWidth = 1;
    for(let j = -1; j < rows; j++){
      for(let i = -1; i < cols; i++){
        const cx = i * cell + cell / 2, cy = j * cell + cell / 2;
        const d = Math.hypot(cx - origin.x, cy - origin.y);
        const g = amp * Math.exp(-Math.pow((d - R) / 90, 2));
        const rot = Math.sin(now * 0.0005 - d * 0.006) * 0.4;
        const r = cell * 0.4 * (1 + 0.15 * g);
        ctx.strokeStyle = "rgba(150,165,190,0.10)";
        star(cx, cy, r, rot);
        poly(cx, cy, r * 0.38, rot, 8);
        poly(cx + cell / 2, cy + cell / 2, cell * 0.14, Math.PI / 4 - rot, 4);
        if(g > 0.03){
          ctx.strokeStyle = "rgba(218,119,86," + (0.7 * g).toFixed(3) + ")";
          star(cx, cy, r, rot);
          poly(cx, cy, r * 0.38, rot, 8);
        }
      }
    }
  }
  function loop(now){ draw(now); requestAnimationFrame(loop); }
  addEventListener("resize", resize);
  addEventListener("pointerdown", e => { origin = { x: e.clientX, y: e.clientY }; tRip = performance.now(); });
  resize();
  if(!reduce) requestAnimationFrame(loop);
})();

/* ---------- Markdown ---------- */
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function escA(s){ return esc(s).replace(/"/g,"&quot;"); }
function inline(t){
  t = esc(t);
  t = t.replace(/`([^`]+)`/g,"<code>$1</code>");
  t = t.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  t = t.replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>");
  return t;
}
function block(text){
  let html = "", list = null, para = [];
  const fP = () => { if(para.length){ html += "<p>" + para.map(inline).join("<br>") + "</p>"; para = []; } };
  const fL = () => { if(list){ html += "<" + list.t + ">" + list.items.map(x => "<li>" + inline(x) + "</li>").join("") + "</" + list.t + ">"; list = null; } };
  for(const raw of text.split("\n")){
    const line = raw.trimEnd(); let m;
    if(!line.trim()){ fP(); fL(); continue; }
    if((m = line.match(/^(#{1,3})\s+(.*)/))){ fP(); fL(); const n = m[1].length + 2; html += "<h"+n+">"+inline(m[2])+"</h"+n+">"; continue; }
    if((m = line.match(/^\s*[-*]\s+(.*)/))){ fP(); if(!list || list.t !== "ul"){ fL(); list = {t:"ul", items:[]}; } list.items.push(m[1]); continue; }
    if((m = line.match(/^\s*\d+\.\s+(.*)/))){ fP(); if(!list || list.t !== "ol"){ fL(); list = {t:"ol", items:[]}; } list.items.push(m[1]); continue; }
    fL(); para.push(line);
  }
  fP(); fL();
  return html;
}
function md(src){
  return src.split("```").map((p, i) => {
    if(i % 2 === 1){
      const nl = p.indexOf("\n");
      return "<pre><code>" + esc((nl >= 0 ? p.slice(nl + 1) : p).replace(/\n$/, "")) + "</code></pre>";
    }
    return block(p);
  }).join("");
}

/* ---------- Yordamchi: toast, popover, modal ---------- */
let toastT;
function toast(t){
  const el = $("toast"); el.textContent = t; el.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove("show"), 2000);
}
let pop = null, popMeta = { a: null, t: 0 };
function closePop(){ if(pop){ pop.el.remove(); pop = null; } }
function popover(anchor, items, opt){
  opt = opt || {};
  if(popMeta.a === anchor && Date.now() - popMeta.t < 350){ popMeta.a = null; return; }
  closePop();
  const el = document.createElement("div"); el.className = "pop";
  items.forEach(it => {
    if(it.sep){ const d = document.createElement("div"); d.className = "sep"; el.appendChild(d); return; }
    const b = document.createElement("button");
    b.className = "pi" + (it.danger ? " danger" : "");
    const inner = it.html || ((it.icon ? '<span class="pico">' + ico(it.icon, 20) + '</span>' : "") + '<span class="pt">' + esc(it.label) + "</span>");
    b.innerHTML = inner + (it.check ? '<span class="pchk">' + ico("check", 18) + "</span>" : "");
    b.onclick = () => { closePop(); if(it.onClick) it.onClick(); };
    el.appendChild(b);
  });
  document.body.appendChild(el);
  const r = anchor.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
  let left = opt.align === "right" ? r.right - w : r.left;
  left = Math.max(8, Math.min(left, innerWidth - w - 8));
  let top = (opt.below && r.bottom + h + 8 < innerHeight) ? r.bottom + 6 : Math.max(8, r.top - h - 8);
  el.style.left = left + "px"; el.style.top = top + "px";
  pop = { el: el, anchor: anchor };
}
document.addEventListener("pointerdown", e => {
  if(pop && !pop.el.contains(e.target)){ popMeta = { a: pop.anchor, t: Date.now() }; closePop(); }
}, true);
document.addEventListener("keydown", e => { if(e.key === "Escape") closePop(); });

function modal(o){
  const root = document.createElement("div"); root.className = "sheet show";
  const p = document.createElement("div"); p.className = "panel" + (o.wide ? " wide" : "");
  p.innerHTML = "<h3>" + esc(o.title) + "</h3>" + (o.text ? "<p>" + esc(o.text) + "</p>" : "") + (o.body || "") +
    '<div class="mrow">' + (o.cancel === false ? "" : '<button class="btn ghost" data-c>Bekor qilish</button>') +
    (o.ok ? '<button class="btn" data-ok>' + esc(o.ok) + "</button>" : "") + "</div>";
  root.appendChild(p); document.body.appendChild(root);
  const close = () => root.remove();
  root.addEventListener("pointerdown", e => { if(e.target === root) close(); });
  const c = p.querySelector("[data-c]"); if(c) c.onclick = close;
  const ok = p.querySelector("[data-ok]");
  if(ok) ok.onclick = () => { if(!o.onOk || o.onOk(p) !== false) close(); };
  if(o.after) o.after(p, close);
  return close;
}

function makeChat(opts){
  opts = opts || {};
  const s = S(), cur0 = active();
  const temp = !!opts.temp, pid = opts.projectId || null;
  if(cur0 && cur0.messages.length === 0 && !!cur0.temp === temp && (cur0.projectId || null) === pid){
    s.chats = s.chats.filter(c => c === cur0 || !c.temp);
    return cur0;
  }
  s.chats = s.chats.filter(c => !c.temp && !(c === cur0 && c.messages.length === 0));
  const c = { id: uid(), title: "Yangi suhbat", messages: [], temp: temp, projectId: pid, star: false };
  s.chats.unshift(c); s.activeId = c.id;
  return c;
}

function collectArtifacts(){
  const out = [];
  S().chats.forEach(c => {
    if(c.temp) return;
    c.messages.forEach(m => {
      if(m.role !== "assistant" || m.error) return;
      const re = /```([\w+-]*)\n([\s\S]*?)```/g; let x;
      while((x = re.exec(m.content))){ out.push({ lang: x[1] || "kod", code: x[2].replace(/\n$/, ""), chat: c.title }); }
    });
  });
  return out.reverse();
}

/* ---------- API va yuborish ---------- */
function toOpenAI(messages){
  // Anthropic-uslubidagi bloklarni (image/document) OpenAI-uslubidagi
  // content massiviga o'giradi, chunki CodeCraft API OpenAI formatini kutadi.
  return messages.map(m => {
    if(typeof m.content === "string") return { role: m.role, content: m.content };
    const parts = m.content.map(b => {
      if(b.type === "text") return { type: "text", text: b.text };
      if(b.type === "image") return { type: "image_url", image_url: { url: "data:" + b.source.media_type + ";base64," + b.source.data } };
      if(b.type === "document") return { type: "text", text: "[PDF fayl biriktirilgan, matn sifatida o'qib bo'lmadi]" };
      return { type: "text", text: "" };
    });
    return { role: m.role, content: parts };
  });
}
async function callAI(messages, system){
  const body = { messages: [{ role: "system", content: system }].concat(toOpenAI(messages)) };
  const res = await fetch("/.netlify/functions/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  const rawText = await res.text();
  let data;
  try{ data = JSON.parse(rawText); }
  catch(e){ throw new Error("Server javobi noto'g'ri (" + res.status + "): " + rawText.slice(0, 200)); }
  if(!res.ok || data.error) throw new Error(data.error || ("Xatolik (" + res.status + ")"));
  return data.reply || "";
}
async function send(){
  if(busy) return;
  let text = input.value.trim();
  if(!text && !pending.length) return;
  if(HOSTED && !apiKey){ needKey(); return; }
  if(!text) text = "Bu faylni ko'rib chiq.";
  if(!active()) makeChat();
  const c = active();
  if(c.messages.length === 0) c.title = text.length > 40 ? text.slice(0, 40) + "…" : text;
  const blocks = [];
  pending.forEach(f => {
    if(f.kind === "image") blocks.push({ type: "image", source: { type: "base64", media_type: f.mime, data: f.data } });
    else if(f.kind === "pdf") blocks.push({ type: "document", source: { type: "base64", media_type: "application/pdf", data: f.data } });
    else blocks.push({ type: "text", text: "[" + f.name + " fayli]\n" + f.data });
  });
  blocks.push({ type: "text", text: text });
  const files = pending.map(f => f.name);
  c.messages.push({ role: "user", content: blocks.length > 1 ? blocks : text, display: text, files: files });
  pending = []; input.value = ""; grow(); renderFiles();
  busy = true; renderAll();
  try{
    const history = c.messages.filter(m => !m.error).map(m => ({ role: m.role, content: m.content }));
    const reply = await callAI(history, sysPrompt(c));
    c.messages.push({ role: "assistant", content: reply || "(bo'sh javob)" });
  }catch(err){
    c.messages.push({ role: "assistant", error: true, content: (err && err.message ? err.message : "Noma'lum xato") + " Qayta urinib ko'ring." });
  }
  busy = false; renderAll();
}
function readFile(f){
  return new Promise((res, rej) => {
    const isImg = /^image\/(jpeg|png|gif|webp)$/.test(f.type);
    const isPdf = f.type === "application/pdf" || /\.pdf$/i.test(f.name);
    const r = new FileReader();
    r.onerror = () => rej(new Error("read"));
    if(isImg || isPdf){
      r.onload = () => res({ name: f.name, kind: isImg ? "image" : "pdf", mime: isImg ? f.type : "application/pdf", data: String(r.result).split(",")[1] });
      r.readAsDataURL(f);
    } else if(f.type.indexOf("image/") === 0){
      rej(new Error("img"));
    } else {
      r.onload = () => res({ name: f.name, kind: "text", data: String(r.result).slice(0, 60000) });
      r.readAsText(f);
    }
  });
}

/* ---------- Ovoz yozish ---------- */
let rec = null, listening = false;
function toggleMic(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ toast("Brauzer ovoz yozishni qo'llamaydi"); return; }
  if(listening && rec){ rec.stop(); return; }
  try{
    rec = new SR(); rec.lang = "uz-UZ"; rec.interimResults = false; rec.continuous = false;
    rec.onresult = e => {
      const t = Array.from(e.results).map(r => r[0].transcript).join(" ");
      input.value = (input.value ? input.value + " " : "") + t; grow();
    };
    rec.onend = () => { listening = false; $("micBtn").classList.remove("rec"); };
    rec.onerror = () => { toast("Mikrofondan foydalanib bo'lmadi"); };
    listening = true; $("micBtn").classList.add("rec"); rec.start();
  }catch(e){ listening = false; $("micBtn").classList.remove("rec"); toast("Mikrofondan foydalanib bo'lmadi"); }
}
